; gihagochi backend Alembic config.
; NOTE: keep this file ASCII-only.
; Python's configparser reads with locale encoding on Windows (cp949 on Korean locale),
; so non-ASCII comments break alembic startup.
; sqlalchemy.url is overridden by DATABASE_URL env var in migrations/env.py.

[alembic]
; migration scripts location (relative to alembic.ini)
script_location = migrations

; new revision file template (e.g. 0001_initial)
file_template = %%(rev)s_%%(slug)s

; timezone (UTC recommended)
timezone = UTC

; max slug length for filename
truncate_slug_length = 40

; placeholder -- actual URL injected from $DATABASE_URL via env.py
sqlalchemy.url = driver://user:pass@host/dbname


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
