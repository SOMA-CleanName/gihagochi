name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 변경 영역만 빌드 — paths-filter로 backend/mobile/admin 별 분기.
jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      mobile: ${{ steps.filter.outputs.mobile }}
      admin: ${{ steps.filter.outputs.admin }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            mobile:
              - 'mobile/**'
              - '.github/workflows/ci.yml'
            admin:
              - 'admin/**'
              - '.github/workflows/ci.yml'

  backend:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('backend/pyproject.toml') }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (ruff)
        run: ruff format --check .
      - name: Type check (mypy, 선택적)
        run: |
          if command -v mypy >/dev/null 2>&1; then
            mypy app || echo "::warning::mypy 실패 - blocking 아님"
          fi
      - name: Test (pytest, integration 마커 제외)
        env:
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_ANON_KEY: test-anon-key
          SUPABASE_SERVICE_ROLE_KEY: test-service-key
          SUPABASE_JWT_SECRET: test-jwt-secret
          DATABASE_URL: postgresql://test:test@localhost:5432/test
        # integration 마커는 실제 dev DB 필요 → CI에선 스킵.
        # 로컬: `pytest -m integration` 또는 마커 옵션 없이 전체 실행.
        run: pytest -x --tb=short -m "not integration"

  mobile:
    needs: detect-changes
    if: needs.detect-changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.4'
          cache: true
      - name: Pub get
        run: flutter pub get
      - name: Create empty .env (gitignored asset placeholder)
        # pubspec.yaml이 .env를 asset로 선언하고 있어 missing이면 analyze가 warning.
        # 시크릿은 dart-define으로 주입하므로 CI는 빈 파일이면 충분.
        run: touch .env
      - name: Code generation (riverpod/freezed/json_serializable)
        run: dart run build_runner build
      - name: Analyze
        # info-level은 fail로 보지 않음 (Flutter 3.41 기본은 info도 exit 1).
        # 기존 pre-existing info(메인 빌더 영역 _template/core/error)는 별도 정리.
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test

  admin:
    needs: detect-changes
    if: needs.detect-changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck
      - name: Build (next build, Turbopack)
        env:
          # build-time 환경변수 없으면 빌드 깨질 수 있어 더미 주입
          NEXT_PUBLIC_SUPABASE_URL: https://test.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
        run: npm run build
